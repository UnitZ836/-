<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Праздник.яр — Агрегатор детских праздников</title>
    <style>
        /* Базовые настройки и переменные */
        :root {
            --purple-gradient: linear-gradient(to left, #9d4edd, #4a00e0);
            --main-purple: #6a00f4;
            --purple-light: #f3e8ff;
            --bg-light: #f8f9fa;
            --text-dark: #212529;
            --text-muted: #6c757d;
            --border-color: #e9ecef;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Шапка сайта (Header) */
        .header {
            background: var(--purple-gradient);
            color: #fff;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(74, 0, 224, 0.15);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .logo span {
            color: rgba(255, 255, 255, 0.7);
            font-weight: 400;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.85);
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: #fff;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-partner {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .btn-partner:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Главный промо-баннер (Hero) */
        .hero {
            background: var(--purple-gradient);
            color: #fff;
            padding: 40px 24px 60px 24px;
            text-align: center;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .hero-subtitle {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* Основной контент (Main Layout) */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 60px 24px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
        }

        /* Боковая панель фильтров */
        .filters-sidebar {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 24px;
            height: fit-content;
            border: 1px solid var(--border-color);
        }

        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .filter-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .btn-reset {
            background: none;
            border: none;
            color: var(--main-purple);
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-section {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
        }

        .filter-section:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .filter-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 14px;
            color: var(--text-dark);
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--main-purple);
            cursor: pointer;
        }

        .range-slider {
            width: 100%;
            accent-color: var(--main-purple);
            margin-top: 8px;
        }

        .range-values {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Сетка результатов и карточки */
        .results-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
        }

        .sort-select {
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--main-purple);
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .card {
            background: #fff;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
        }

        .card-image-wrapper {
            position: relative;
            padding-top: 56.25%; /* Пропорции 16:9 */
            background-color: #e9ecef;
        }

        .card-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #fff;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .badge.recommend {
            color: #2a9d8f;
        }

        .badge.popular {
            color: var(--main-purple);
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-dark);
            line-height: 1.3;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .card-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .btn-more {
            background-color: var(--purple-light);
            color: var(--main-purple);
            padding: 10px 18px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            transition: var(--transition);
            border: none;
            cursor: pointer;
        }

        .btn-more:hover {
            background-color: var(--main-purple);
            color: #fff;
        }

        /* Адаптивность под мобильные устройства */
        @media (max-width: 992px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 576px) {
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .header-container {
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Шапка (Header) -->
    <header class="header">
        <div class="header-container">
            <a href="#" class="logo">
                <!-- Минималистичный SVG логотип-хлопушка -->
                <div class="logo-icon">
